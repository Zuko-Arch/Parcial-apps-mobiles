<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Mi cámara</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <p class="instruccion">Presiona el botón para tomar una fotografía.</p>

  <ion-button expand="block" (click)="tomarFoto()"> Tomar fotografía </ion-button>

  <div class="area-foto">
    @if (fotoUrl()) {
    <img [src]="fotoUrl()" alt="Fotografía capturada" />
    } @else {
    <p class="sin-foto">Aún no hay ninguna fotografía.</p>
    }
  </div>
</ion-content>
